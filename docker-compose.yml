services:
  postgres:
    image: postgres:17-alpine
    container_name: oqh-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-openqualityhub}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: oqh-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-openqualityhub}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-Y29tcGxleC1zZWNyZXQta2V5LWZvci1vcGVuLXF1YWxpdHktaHViLWp3dC10b2tlbi1zaWduaW5nLWRldi1vbmx5}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-demo}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: oqh-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
