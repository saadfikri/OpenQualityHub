spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # URL, username, password injected via @DynamicPropertySource from Testcontainers

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    jwt:
      secret: dGVzdC1pbnRlZ3JhdGlvbi1zZWNyZXQta2V5LWZvci1vcGVuLXF1YWxpdHktaHViLWludGVncmF0aW9uLXRlc3Rz
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    auth-requests-per-minute: 1000

logging:
  level:
    com.openqualityhub: WARN
    org.springframework.security: WARN
    org.testcontainers: INFO
    org.flywaydb: INFO
